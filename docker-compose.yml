version: "3.8"

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expressive-blog
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - blog_data:/app/data
      - blog_uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/blog.db
      - PORT=3000
      # IMPORTANT: Change this to a strong random secret in production!
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-random-secret-string}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  blog_data:
    driver: local
  blog_uploads:
    driver: local
